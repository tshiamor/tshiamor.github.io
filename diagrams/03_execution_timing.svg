<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="700" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <rect x="30" y="20" width="640" height="50" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="350" y="52" text-anchor="middle" fill="white" font-size="20" font-weight="700">Trajectory Execution Timing</text>

  <!-- Row 1: cuRobo output -->
  <rect x="80" y="100" width="540" height="60" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="100" width="8" height="60" rx="4" fill="#8b5cf6"/>
  <text x="108" y="126" fill="#334155" font-size="16" font-weight="700">cuRobo Output</text>
  <text x="108" y="148" fill="#64748b" font-size="13">200 Hz interpolated trajectory (position + velocity per joint)</text>
  <rect x="470" y="112" width="130" height="28" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="535" y="131" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="600">200 Hz</text>

  <!-- Arrow -->
  <line x1="350" y1="160" x2="350" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="183" fill="#64748b" font-size="11" font-style="italic">dispatched every 2nd step</text>

  <!-- Row 2: Isaac Sim -->
  <rect x="80" y="200" width="540" height="60" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="200" width="8" height="60" rx="4" fill="#3b82f6"/>
  <text x="108" y="226" fill="#334155" font-size="16" font-weight="700">Isaac Sim Physics</text>
  <text x="108" y="248" fill="#64748b" font-size="13">Robot PD controller tracks joint position + velocity targets</text>
  <rect x="470" y="212" width="130" height="28" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="535" y="231" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">60 Hz physics</text>

  <!-- Arrow -->
  <line x1="350" y1="260" x2="350" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="283" fill="#64748b" font-size="11" font-style="italic">~100 Hz effective cmd rate</text>

  <!-- Row 3: Robot Joints -->
  <rect x="80" y="300" width="540" height="60" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="300" width="8" height="60" rx="4" fill="#f59e0b"/>
  <text x="108" y="326" fill="#334155" font-size="16" font-weight="700">Robot Joints</text>
  <text x="108" y="348" fill="#64748b" font-size="13">PD controller tracks position + velocity targets per joint</text>
  <rect x="470" y="312" width="130" height="28" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="535" y="331" text-anchor="middle" fill="#92400e" font-size="12" font-weight="600">6 DOF control</text>

  <!-- Arrow -->
  <line x1="350" y1="360" x2="350" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="383" fill="#64748b" font-size="11" font-style="italic">settle 15 steps after plan done</text>

  <!-- Row 4: Target Reached -->
  <rect x="80" y="400" width="540" height="60" rx="10" fill="white" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="400" width="8" height="60" rx="4" fill="#22c55e"/>
  <text x="108" y="426" fill="#334155" font-size="16" font-weight="700">Target Reached</text>
  <text x="108" y="448" fill="#64748b" font-size="13">EE within 2cm of goal AND trajectory fully executed</text>
  <rect x="470" y="412" width="130" height="28" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="535" y="431" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">&#10003; state advance</text>

  <!-- Footer -->
  <text x="350" y="500" text-anchor="middle" fill="#94a3b8" font-size="11">Both position AND velocity feedforward commands ensure smooth tracking with minimal overshoot.</text>
</svg>