<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="450" y="52" text-anchor="middle" fill="white" font-size="20" font-weight="700">ATI Axia80 Force/Torque Sensor</text>

  <!-- ===== LEFT: Kinematic Chain ===== -->
  <text x="170" y="100" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">Kinematic Chain at Wrist</text>

  <!-- wrist_3_link -->
  <rect x="100" y="120" width="140" height="40" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="145" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">wrist_3_link</text>

  <line x1="170" y1="160" x2="170" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tool0 -->
  <rect x="120" y="190" width="100" height="40" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="215" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">tool0</text>

  <line x1="170" y1="230" x2="170" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AXIA80 SENSOR (highlighted) -->
  <rect x="80" y="260" width="180" height="70" rx="10" fill="url(#sensorGrad)" filter="url(#shadow)"/>
  <text x="170" y="288" text-anchor="middle" fill="white" font-size="15" font-weight="700">AXIA80</text>
  <text x="170" y="310" text-anchor="middle" fill="#fecaca" font-size="11">6-axis F/T sensor</text>
  <!-- Glow effect -->
  <rect x="76" y="256" width="188" height="78" rx="12" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" opacity="0.5"/>

  <line x1="170" y1="330" x2="170" y2="355" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- hande_coupler -->
  <rect x="95" y="360" width="150" height="40" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="385" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">hande_coupler</text>

  <line x1="170" y1="400" x2="170" y2="425" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hand-E Gripper -->
  <rect x="100" y="430" width="140" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="453" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">Hand-E</text>
  <text x="170" y="470" text-anchor="middle" fill="#64748b" font-size="11">Gripper</text>

  <!-- Arrow label: measures between -->
  <text x="280" y="300" fill="#dc2626" font-size="11" font-weight="600">Measures forces &amp;</text>
  <text x="280" y="316" fill="#dc2626" font-size="11" font-weight="600">torques between</text>
  <text x="280" y="332" fill="#dc2626" font-size="11" font-weight="600">tool0 &#8596; coupler</text>

  <!-- ===== RIGHT TOP: Axes + What it measures ===== -->
  <text x="620" y="100" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">What It Measures</text>

  <!-- Axis diagram -->
  <line x1="570" y1="220" x2="570" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="132" fill="#334155" font-size="12" font-weight="600">+Z (up)</text>

  <line x1="570" y1="220" x2="670" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="678" y="224" fill="#334155" font-size="12" font-weight="600">+X</text>

  <line x1="570" y1="220" x2="530" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="175" fill="#334155" font-size="12" font-weight="600">+Y</text>

  <circle cx="570" cy="220" r="4" fill="#334155"/>

  <!-- Forces box -->
  <rect x="480" y="250" width="180" height="110" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="480" y="250" width="180" height="30" rx="8" fill="#3b82f6"/>
  <rect x="480" y="268" width="180" height="12" fill="#3b82f6"/>
  <text x="570" y="272" text-anchor="middle" fill="white" font-size="13" font-weight="700">Forces (N)</text>
  <text x="500" y="302" fill="#334155" font-size="13">Fx: lateral X</text>
  <text x="500" y="322" fill="#334155" font-size="13">Fy: lateral Y</text>
  <text x="500" y="342" fill="#334155" font-size="13" font-weight="600">Fz: vertical Z</text>

  <!-- Torques box -->
  <rect x="680" y="250" width="180" height="110" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="680" y="250" width="180" height="30" rx="8" fill="#f59e0b"/>
  <rect x="680" y="268" width="180" height="12" fill="#f59e0b"/>
  <text x="770" y="272" text-anchor="middle" fill="white" font-size="13" font-weight="700">Torques (Nm)</text>
  <text x="700" y="302" fill="#334155" font-size="13">Tx: about X</text>
  <text x="700" y="322" fill="#334155" font-size="13">Ty: about Y</text>
  <text x="700" y="342" fill="#334155" font-size="13">Tz: about Z</text>

  <!-- Grip detection -->
  <rect x="480" y="385" width="380" height="75" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="408" fill="#991b1b" font-size="13" font-weight="700">Grip Detection via Fz:</text>
  <text x="500" y="430" fill="#334155" font-size="13">Fz &#8776; 0 N     &#8594;  nothing held (free air)</text>
  <text x="500" y="450" fill="#dc2626" font-size="13" font-weight="600">Fz &#8805; 0.5 N   &#8594;  object detected in gripper &#10003;</text>

  <!-- ===== BOTTOM: Data Flow ===== -->
  <rect x="30" y="500" width="840" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="530" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">Sensor Data Flow</text>

  <!-- PhysX -->
  <rect x="60" y="548" width="220" height="44" rx="8" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="170" y="575" text-anchor="middle" fill="white" font-size="13" font-weight="600">PhysX Joint Force Solver</text>

  <line x1="280" y1="570" x2="330" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API call -->
  <rect x="335" y="548" width="240" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="455" y="568" text-anchor="middle" fill="#475569" font-size="10" font-family="'Courier New', monospace">get_measured_joint_forces()</text>
  <text x="455" y="583" text-anchor="middle" fill="#94a3b8" font-size="10">(num_envs, num_bodies, 6)</text>

  <line x1="575" y1="570" x2="625" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="630" y="548" width="220" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="740" y="568" text-anchor="middle" fill="#92400e" font-size="11" font-family="'Courier New', monospace">ft_data[0, axia80_idx]</text>
  <text x="740" y="583" text-anchor="middle" fill="#92400e" font-size="10">[Fx, Fy, Fz, Tx, Ty, Tz]</text>

  <!-- Two outputs -->
  <line x1="700" y1="592" x2="640" y2="630" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="592" x2="800" y2="630" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="555" y="634" width="155" height="32" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="632" y="655" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">Grip Verification</text>

  <rect x="738" y="634" width="120" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="798" y="655" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600">HDF5 Recording</text>
</svg>