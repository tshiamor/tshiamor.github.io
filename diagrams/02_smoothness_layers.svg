<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="l1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="l3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="l4Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <rect x="30" y="20" width="840" height="56" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="450" y="55" text-anchor="middle" fill="white" font-size="22" font-weight="700">Four Layers of Trajectory Smoothness</text>

  <!-- ===== LAYER 1: OPTIMIZATION COST TERMS ===== -->
  <rect x="50" y="100" width="800" height="220" rx="14" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <!-- Layer badge -->
  <rect x="50" y="100" width="800" height="46" rx="14" fill="url(#l1Grad)"/>
  <rect x="50" y="126" width="800" height="20" fill="url(#l1Grad)"/>
  <text x="80" y="130" fill="white" font-size="11" font-weight="700" opacity="0.8">LAYER 1</text>
  <text x="450" y="130" text-anchor="middle" fill="white" font-size="17" font-weight="700">Optimization Cost Terms</text>
  <text x="80" y="170" fill="#78716c" font-size="13" font-style="italic">The optimizer penalizes non-smooth motion directly (soft costs):</text>

  <!-- Cost terms table -->
  <rect x="80" y="186" width="740" height="36" rx="6" fill="#fffbeb"/>
  <text x="100" y="210" fill="#92400e" font-size="14" font-weight="600">Velocity cost:</text>
  <text x="280" y="210" fill="#78716c" font-size="14" font-family="'Courier New', monospace">&#931; &#8214;&#952;&#775;&#7522;&#8214;&#178;</text>
  <text x="520" y="210" fill="#92400e" font-size="13">&#8594; penalizes fast motion</text>

  <rect x="80" y="228" width="740" height="36" rx="6" fill="white"/>
  <text x="100" y="252" fill="#92400e" font-size="14" font-weight="600">Acceleration cost:</text>
  <text x="280" y="252" fill="#78716c" font-size="14" font-family="'Courier New', monospace">&#931; &#8214;&#952;&#776;&#7522;&#8214;&#178;</text>
  <text x="520" y="252" fill="#92400e" font-size="13">&#8594; penalizes jerky speed changes</text>

  <rect x="80" y="270" width="740" height="36" rx="6" fill="#fffbeb"/>
  <text x="100" y="294" fill="#92400e" font-size="14" font-weight="600">Jerk cost:</text>
  <text x="280" y="294" fill="#78716c" font-size="14" font-family="'Courier New', monospace">&#931; &#8214;&#952;&#8411;&#7522;&#8214;&#178;</text>
  <text x="520" y="294" fill="#92400e" font-size="13">&#8594; penalizes sudden acceleration changes</text>

  <!-- Soft costs label -->
  <rect x="580" y="160" width="230" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="695" y="178" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">SOFT COSTS &#8212; traded against goal</text>

  <!-- ===== LAYER 2: HARD CONSTRAINTS ===== -->
  <rect x="50" y="345" width="800" height="220" rx="14" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="345" width="800" height="46" rx="14" fill="url(#l2Grad)"/>
  <rect x="50" y="371" width="800" height="20" fill="url(#l2Grad)"/>
  <text x="80" y="375" fill="white" font-size="11" font-weight="700" opacity="0.8">LAYER 2</text>
  <text x="450" y="375" text-anchor="middle" fill="white" font-size="17" font-weight="700">Hard Kinodynamic Constraints</text>
  <text x="80" y="415" fill="#78716c" font-size="13" font-style="italic">Enforced at every timestep. No trajectory that violates these is accepted:</text>

  <!-- Constraint table -->
  <rect x="80" y="434" width="740" height="36" rx="6" fill="#fef2f2"/>
  <text x="100" y="457" fill="#991b1b" font-size="14" font-family="'Courier New', monospace" font-weight="600">|&#952;&#775;|</text>
  <text x="160" y="457" fill="#991b1b" font-size="14">&#8804;  max_velocity</text>
  <text x="520" y="457" fill="#78716c" font-size="13">(per-joint mechanical limit)</text>

  <rect x="80" y="476" width="740" height="36" rx="6" fill="white"/>
  <text x="100" y="499" fill="#991b1b" font-size="14" font-family="'Courier New', monospace" font-weight="600">|&#952;&#776;|</text>
  <text x="160" y="499" fill="#991b1b" font-size="14">&#8804;  6.0 rad/s&#178;</text>
  <text x="520" y="499" fill="#78716c" font-size="13">(reduced from default 12.0)</text>

  <rect x="80" y="518" width="740" height="36" rx="6" fill="#fef2f2"/>
  <text x="100" y="541" fill="#991b1b" font-size="14" font-family="'Courier New', monospace" font-weight="600">|&#952;&#8411;|</text>
  <text x="160" y="541" fill="#991b1b" font-size="14">&#8804;  200.0 rad/s&#179;</text>
  <text x="520" y="541" fill="#78716c" font-size="13">(reduced from default 500.0)</text>

  <!-- Hard constraint label -->
  <rect x="580" y="405" width="230" height="26" rx="13" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="695" y="423" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="600">HARD &#8212; never violated</text>

  <!-- ===== LAYER 3: TIME DILATION ===== -->
  <rect x="50" y="590" width="800" height="210" rx="14" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="590" width="800" height="46" rx="14" fill="url(#l3Grad)"/>
  <rect x="50" y="616" width="800" height="20" fill="url(#l3Grad)"/>
  <text x="80" y="620" fill="white" font-size="11" font-weight="700" opacity="0.8">LAYER 3</text>
  <text x="450" y="620" text-anchor="middle" fill="white" font-size="17" font-weight="700">Time Dilation (factor = 0.5&#215;)</text>
  <text x="80" y="660" fill="#78716c" font-size="13" font-style="italic">After optimization, the trajectory is played back at half speed:</text>

  <!-- Effect table -->
  <rect x="80" y="680" width="360" height="36" rx="6" fill="#ecfdf5"/>
  <text x="100" y="703" fill="#065f46" font-size="14" font-weight="600">Effective velocity</text>
  <text x="450" y="703" text-anchor="end" fill="#065f46" font-size="14" font-family="'Courier New', monospace">= planned &#215; 0.5</text>

  <rect x="80" y="722" width="360" height="36" rx="6" fill="white"/>
  <text x="100" y="745" fill="#065f46" font-size="14" font-weight="600">Effective acceleration</text>
  <text x="450" y="745" text-anchor="end" fill="#065f46" font-size="14" font-family="'Courier New', monospace">= planned &#215; 0.25</text>

  <rect x="80" y="764" width="360" height="36" rx="6" fill="#ecfdf5"/>
  <text x="100" y="787" fill="#065f46" font-size="14" font-weight="600">Effective jerk</text>
  <text x="450" y="787" text-anchor="end" fill="#065f46" font-size="14" font-family="'Courier New', monospace">= planned &#215; 0.125</text>

  <!-- Visual: speed bars -->
  <rect x="530" y="688" width="250" height="16" rx="4" fill="#d1fae5"/>
  <rect x="530" y="688" width="250" height="16" rx="4" fill="#10b981" opacity="0.5"/>
  <text x="540" y="700" fill="white" font-size="10" font-weight="600">PLANNED SPEED</text>

  <rect x="530" y="718" width="125" height="16" rx="4" fill="#10b981"/>
  <text x="540" y="730" fill="white" font-size="10" font-weight="600">ACTUAL (0.5&#215;)</text>

  <text x="530" y="770" fill="#065f46" font-size="12" font-style="italic">Simple but powerful smoothing</text>
  <text x="530" y="788" fill="#065f46" font-size="12" font-style="italic">technique for real hardware.</text>

  <!-- ===== LAYER 4: DENSE INTERPOLATION ===== -->
  <rect x="50" y="825" width="800" height="240" rx="14" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="825" width="800" height="46" rx="14" fill="url(#l4Grad)"/>
  <rect x="50" y="851" width="800" height="20" fill="url(#l4Grad)"/>
  <text x="80" y="855" fill="white" font-size="11" font-weight="700" opacity="0.8">LAYER 4</text>
  <text x="450" y="855" text-anchor="middle" fill="white" font-size="17" font-weight="700">Dense Cubic Spline Interpolation (200 Hz)</text>
  <text x="80" y="895" fill="#78716c" font-size="13" font-style="italic">48 optimized waypoints are upsampled to 200 Hz using cubic spline interpolation:</text>

  <!-- Before/after visualization -->
  <!-- Coarse dots -->
  <text x="100" y="930" fill="#1e40af" font-size="12" font-weight="600">Before (48 pts):</text>
  <circle cx="260" cy="926" r="5" fill="#3b82f6"/>
  <circle cx="320" cy="926" r="5" fill="#3b82f6"/>
  <circle cx="380" cy="926" r="5" fill="#3b82f6"/>
  <circle cx="440" cy="926" r="5" fill="#3b82f6"/>
  <text x="480" y="930" fill="#93a3b8" font-size="11">...</text>
  <circle cx="520" cy="926" r="5" fill="#3b82f6"/>
  <circle cx="580" cy="926" r="5" fill="#3b82f6"/>
  <circle cx="640" cy="926" r="5" fill="#3b82f6"/>
  <circle cx="700" cy="926" r="5" fill="#3b82f6"/>

  <!-- Dense dots -->
  <text x="100" y="966" fill="#1e40af" font-size="12" font-weight="600">After (~1000 pts):</text>
  <circle cx="260" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="270" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="280" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="290" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="300" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="310" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="320" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="330" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="340" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="350" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="360" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="370" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="380" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="390" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="400" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="410" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="420" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="430" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="440" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="450" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="460" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="470" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="480" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="490" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="500" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="510" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="520" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="530" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="540" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="550" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="560" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="570" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="580" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="590" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="600" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="610" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="620" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="630" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="640" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="650" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="660" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="670" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="680" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="690" cy="962" r="3" fill="#3b82f6"/>
  <circle cx="700" cy="962" r="3" fill="#3b82f6"/>

  <!-- Guarantees -->
  <text x="100" y="1006" fill="#1e40af" font-size="13">&#10003; No discontinuities between waypoints</text>
  <text x="100" y="1028" fill="#1e40af" font-size="13">&#10003; Smooth position, velocity, and acceleration profiles</text>
  <text x="100" y="1050" fill="#1e40af" font-size="13">&#10003; Sub-millisecond resolution for the robot controller</text>
</svg>